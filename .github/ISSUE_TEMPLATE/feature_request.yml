name: Suggestion
description: Suggest a resource, collection or improvement
body:
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to add or improve?
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Why is it useful?
      description: Include sources, relevant links and any connection you have to the proposed project.
    validations:
      required: true
